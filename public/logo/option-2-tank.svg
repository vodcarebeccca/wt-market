<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="120" fill="transparent"/>
  <!-- Tank silhouette -->
  <g transform="translate(40,60)" fill="none" stroke="url(#g2)" stroke-width="2.5" filter="url(#glow2)" opacity="0.9">
    <rect x="0" y="15" width="80" height="12" rx="3"/>
    <polygon points="10,15 25,-8 55,-8 70,15"/>
    <rect x="30" y="-20" width="20" height="15" rx="2"/>
    <circle cx="20" cy="32" r="14"/>
    <circle cx="60" cy="32" r="14"/>
    <circle cx="20" cy="32" r="5" fill="url(#g2)"/>
    <circle cx="60" cy="32" r="5" fill="url(#g2)"/>
  </g>
  <!-- Text -->
  <text x="140" y="52" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="url(#g2)" filter="url(#glow2)" letter-spacing="2">WT MARKET</text>
  <text x="140" y="72" font-family="Arial,sans-serif" font-size="11" fill="#a1a1aa" letter-spacing="4">WAR THUNDER ACCOUNTS</text>
  <line x1="140" y1="80" x2="360" y2="80" stroke="url(#g2)" stroke-width="1" opacity="0.3"/>
</svg>